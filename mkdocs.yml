site_name: TEF-Health Call Management
site_url: http://127.0.0.1:8000
site_description: "TEF-Health Documentation"
site_author: "TEF-Health Work Package 1: Petra Ritter, Michael Schirner, Marc Sacks, Leon Martin, Rico Schmitt"
copyright: "(c) 2025 TEF-Health Consortium"
nav:
  - Applicant Guide: 
    - How it works:
      - Call Process: index.md
      - Creating a User Account: accounts.md
      - Submitting an Application: applicant.md
      - Helpdesk: helpdesk.md
    - TEF-Health Calls:
      - Call 1—Portugal Services: call1.md
      - Call 2—Mutli-EU Services: call2.md
  - Service Catalogue: service-catalogue.md
  - Internal documentation:
    - Overview: overview.md
    - Requesting Permissions: permissions.md
    - Call Workflow: workflow.md
    - Helpdesk (Internal): helpdesk-internal.md
    - Service Provider: service-provider.md
    - Reviewer: reviewer.md
    - Front Office: front-office.md
    - Node Leader: node-leader.md
    - Coordinator: coordinator.md
    - Administrative:
      - Permission Management: admin.md
      - CSV Export: csv-export.md
      - Editing Service Catalogue: edit-sc.md
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
theme:
  name: material
  logo: img/tefhires3.png
  favicon: img/tefhires3.png